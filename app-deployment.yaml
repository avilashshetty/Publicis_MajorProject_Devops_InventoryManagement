apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-management-app
spec:
  replicas: 2
  selector:
   matchLabels:
     app: inventory-management-app
  template:
   metadata:
     labels:
       app: inventory-management-app
     annotations:
       ad.datadoghq.com/inventory-management-app.logs: '[{"source":"nodejs","service":"inventory-management-service"},{"source":"nodejs","service":"inventory-management-app"}]'
   spec:
     containers:
     - name: fitness-tracker-app
       image: rahul69980/image_invent:v1.4.0
       ports:
       - containerPort: 3000
       env:
       - name: MONGODB_URI
         value: "mongodb://mongodb-service:27017/inventorydb_prod"
       - name: PORT
         value: "3000"
       - name: HOST
         value: "0.0.0.0"
       - name: NODE_ENV
         value: "production"
       # Datadog APM (tracing) env variables
       - name: DD_AGENT_HOST
         valueFrom:
           fieldRef:
             fieldPath: status.hostIP
       - name: DD_TRACE_AGENT_PORT
         value: "8126"
       - name: DD_ENV
         value: "production"
       - name: DD_SERVICE
         value: "inventory-management-app"
       - name: DD_VERSION
         value: "1.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-management-service
spec:
  selector:
   app: inventory-management-app
  ports:
  - port: 8070
   targetPort: 3000
  type: LoadBalancer